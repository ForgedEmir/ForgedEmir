<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hero render</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #stage {
    position: relative; width: 1600px; height: 520px; overflow: hidden;
    border-radius: 26px; background: #03070d; isolation: isolate;
  }
  #gl { position: absolute; inset: 0; }
  #veil {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(90deg, rgba(3,7,13,.97) 0%, rgba(3,7,13,.88) 30%, rgba(3,7,13,.35) 48%, rgba(3,7,13,0) 62%),
      radial-gradient(120% 140% at 50% 50%, rgba(0,0,0,0) 60%, rgba(0,0,0,.55) 100%);
  }
  #edge { position: absolute; inset: 0; border-radius: 26px; box-shadow: inset 0 0 0 1px rgba(150,190,215,.14); pointer-events: none; }
  .ui { position: absolute; left: 92px; top: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  .kicker { font: 500 15px 'JetBrains Mono', monospace; letter-spacing: .34em; color: #7fa6bd; display: flex; align-items: center; gap: 14px; }
  .kicker i { display: inline-block; width: 34px; height: 1px; background: linear-gradient(90deg, #e3a862, rgba(227,168,98,0)); }
  .name {
    font: 700 108px/1 'Space Grotesk', sans-serif; letter-spacing: -0.025em; margin: 22px 0 20px -4px;
    background-image: linear-gradient(100deg, #eef4f8 0%, #eef4f8 42%, #ffd8a8 49%, #fff3e2 50%, #ffd8a8 51%, #eef4f8 58%, #eef4f8 100%);
    background-size: 320% 100%; background-repeat: no-repeat;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 30px rgba(119,168,195,.18));
  }
  .tag { font: 400 31px 'Inter', sans-serif; color: #c4d4de; letter-spacing: -0.005em; }
  .tag b { font-weight: 500; color: #e9b77a; }
  .pill {
    margin-top: 34px; align-self: flex-start; display: flex; align-items: center; gap: 14px;
    padding: 12px 22px 12px 18px; border-radius: 999px;
    background: rgba(14,34,49,.72); box-shadow: inset 0 0 0 1px rgba(150,190,215,.18), 0 10px 40px rgba(0,0,0,.35);
    font: 500 17px 'Inter', sans-serif; color: #e6eef3;
  }
  .dot { position: relative; width: 12px; height: 12px; }
  .dot::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: #5fd39a; box-shadow: 0 0 12px #5fd39a; }
  .dot span { position: absolute; inset: 0; border-radius: 50%; border: 2px solid #5fd39a; }
  .hud { position: absolute; font: 400 12.5px 'JetBrains Mono', monospace; letter-spacing: .22em; color: #4e7186; }
  .hud.tl { left: 92px; top: 38px; }
  .hud.br { right: 40px; bottom: 32px; text-align: right; }
  .hud em { font-style: normal; color: #e3a862; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1600" height="520"></canvas>
  <div id="veil"></div>
  <div class="hud tl"><em>●</em>&nbsp; 50.63°N 5.57°E · LIÈGE, BELGIUM</div>
  <div class="ui">
    <div class="kicker"><i></i>APPLIED AI · AGENTS · CLOUD</div>
    <div class="name" id="name">Emir Makhtsaev</div>
    <div class="tag">I build AI systems <b>you can trust.</b></div>
    <div class="pill"><div class="dot"><span id="ring"></span></div>Open to a 6-month internship · 2027</div>
  </div>
    <div id="edge"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import * as topojson from 'https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm';

const W = 1600, H = 520, T = 8;         // loop length in seconds
const TAU = Math.PI * 2;
const R = 2.4;                          // globe radius
const params = new URLSearchParams(location.search);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0x03070d, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);
camera.position.set(0, 0, 9.2);

const globe = new THREE.Group();
globe.position.set(3.95, -0.42, 0);
scene.add(globe);
const earth = new THREE.Group();        // rotates with the planet
globe.add(earth);
const LAT0 = 34, LON0 = 12;

function ll(lat, lon, r = R) {
  const la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
  return new THREE.Vector3(r * Math.cos(la) * Math.sin(lo), r * Math.sin(la), r * Math.cos(la) * Math.cos(lo));
}

// ---------- land mask from Natural Earth ----------
const topo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-50m.json')).json();
const land = topojson.feature(topo, topo.objects.land);
const MW = 2048, MH = 1024;
const mask = document.createElement('canvas'); mask.width = MW; mask.height = MH;
const mx = mask.getContext('2d');
mx.fillStyle = '#000'; mx.fillRect(0, 0, MW, MH); mx.fillStyle = '#fff';
const polys = (land.features || [land]).flatMap((f) => (f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : [f.geometry.coordinates]));
mx.beginPath();
for (const poly of polys) for (const ring of poly) {
  let prev = null;
  ring.forEach(([lon, lat], i) => {
    const x = (lon + 180) / 360 * MW, y = (90 - lat) / 180 * MH;
    if (i === 0 || (prev !== null && Math.abs(lon - prev) > 180)) mx.moveTo(x, y); else mx.lineTo(x, y);
    prev = lon;
  });
  mx.closePath();
}
mx.fill('evenodd');
const md = mx.getImageData(0, 0, MW, MH).data;
const isLand = (lat, lon) => {
  const x = Math.min(MW - 1, Math.max(0, Math.floor((lon + 180) / 360 * MW)));
  const y = Math.min(MH - 1, Math.max(0, Math.floor((90 - lat) / 180 * MH)));
  return md[(y * MW + x) * 4] > 127;
};

// ---------- deterministic random ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- ocean sphere ----------
const sun = new THREE.Vector3(-0.55, 0.62, 0.56).normalize();
const ocean = new THREE.Mesh(
  new THREE.SphereGeometry(R * 0.994, 128, 96),
  new THREE.ShaderMaterial({
    uniforms: { uSun: { value: sun } },
    vertexShader: `varying vec3 vN; varying vec3 vV; varying vec3 vW;
      void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz);
      vW = normalize((modelMatrix*vec4(position,0.)).xyz); gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `uniform vec3 uSun; varying vec3 vN; varying vec3 vV; varying vec3 vW;
      void main(){ float f = 1.0 - max(dot(vN, vV), 0.0);
        float light = clamp(dot(vW, uSun)*0.5 + 0.55, 0.0, 1.0);
        vec3 base = mix(vec3(0.006,0.016,0.028), vec3(0.018,0.058,0.092), light);
        vec3 col = base + pow(f, 2.6) * vec3(0.05, 0.19, 0.31) * (0.4 + light);
        gl_FragColor = vec4(col, 1.0); }`,
  })
);
earth.add(ocean);

// ---------- graticule (very faint lat/lon lines) ----------
{
  const pts = [];
  for (let lat = -60; lat <= 60; lat += 30) for (let lon = -180; lon < 180; lon += 2) pts.push(ll(lat, lon, R * 1.0005), ll(lat, lon + 2, R * 1.0005));
  for (let lon = -180; lon < 180; lon += 30) for (let lat = -88; lat < 88; lat += 2) pts.push(ll(lat, lon, R * 1.0005), ll(lat + 2, lon, R * 1.0005));
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  earth.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x2a5873, transparent: true, opacity: 0.16, depthWrite: false })));
}

// ---------- land dots ----------
const dotUniforms = { uTime: { value: 0 }, uSun: { value: sun } };
{
  const N = 90000, pos = [], rnds = [];
  const ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = ga * i;
    const x = Math.cos(th) * r, z = Math.sin(th) * r;
    const lat = Math.asin(y) * 180 / Math.PI, lon = Math.atan2(x, z) * 180 / Math.PI;
    if (!isLand(lat, lon)) continue;
    pos.push(x * R * 1.002, y * R * 1.002, z * R * 1.002); rnds.push(rnd());
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aRand', new THREE.Float32BufferAttribute(rnds, 1));
  earth.add(new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: dotUniforms, transparent: true, depthWrite: false,
    vertexShader: `attribute float aRand; varying float vFace; varying float vRand; varying float vLight; uniform vec3 uSun;
      void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); vec3 n = normalize(normalMatrix*normalize(position));
        vFace = dot(n, normalize(-mv.xyz)); vRand = aRand;
        vLight = clamp(dot(normalize((modelMatrix*vec4(position,0.)).xyz), uSun)*0.5+0.55, 0.0, 1.0);
        gl_PointSize = 2.35 * (9.2 / -mv.z); gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `uniform float uTime; varying float vFace; varying float vRand; varying float vLight;
      void main(){ if (vFace < 0.0) discard; vec2 c = gl_PointCoord - 0.5; float d = length(c); if (d > 0.5) discard;
        float a = smoothstep(0.5, 0.15, d) * smoothstep(0.0, 0.32, vFace);
        float tw = 0.82 + 0.18 * sin(6.2831853 * (uTime / 8.0) * 2.0 + vRand * 6.2831853);
        float spark = step(0.985, vRand) * (0.5 + 0.5 * sin(6.2831853 * (uTime / 8.0) * 3.0 + vRand * 40.0));
        vec3 col = mix(vec3(0.16, 0.33, 0.46), vec3(0.58, 0.82, 0.98), vLight) * tw;
        col += spark * vec3(1.0, 0.72, 0.42) * 1.4;
        gl_FragColor = vec4(col, a); }`,
  })));
}

// ---------- atmosphere ----------
for (const [s, p, k, c, gain] of [[1.15, 5.0, 0.64, [0.22, 0.52, 1.0], 0.95], [1.022, 3.2, 0.84, [0.40, 0.70, 1.0], 0.42]]) {
  globe.add(new THREE.Mesh(new THREE.SphereGeometry(R * s, 96, 64), new THREE.ShaderMaterial({
    side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
    uniforms: { uSun: { value: sun } },
    vertexShader: `varying vec3 vN; varying vec3 vW; void main(){ vN = normalize(normalMatrix*normal); vW = normalize((modelMatrix*vec4(normal,0.)).xyz); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform vec3 uSun; varying vec3 vN; varying vec3 vW;
      void main(){ float i = pow(max(${k.toFixed(2)} - dot(vN, vec3(0.,0.,1.)), 0.0), ${p.toFixed(1)});
        float l = clamp(dot(-vW, uSun)*0.45+0.6, 0.3, 1.0);
        gl_FragColor = vec4(vec3(${c.map(v => v.toFixed(2)).join(',')}) * i * ${gain.toFixed(2)} * l, 1.0); }`,
  })));
}

// ---------- arcs ----------
const HOME = [50.63, 5.57];
const cities = {
  Dublin: [53.35, -6.26], Stockholm: [59.33, 18.07], Madrid: [40.42, -3.70], SaoPaulo: [-23.55, -46.63],
  Johannesburg: [-26.20, 28.05], Dubai: [25.20, 55.27], Mumbai: [19.08, 72.88], Reykjavik: [64.15, -21.94],
  Lagos: [6.52, 3.38], Cairo: [30.04, 31.24], Nairobi: [-1.29, 36.82], Warsaw: [52.23, 21.01],
};
const routes = [
  ['HOME', 'Dublin', 0.00, 1], ['HOME', 'Stockholm', 0.42, 1], ['HOME', 'Madrid', 0.18, 1], ['HOME', 'SaoPaulo', 0.62, 1],
  ['HOME', 'Johannesburg', 0.30, 1], ['HOME', 'Dubai', 0.80, 1], ['HOME', 'Mumbai', 0.08, 1], ['HOME', 'Reykjavik', 0.55, 1],
  ['Madrid', 'Lagos', 0.70, 2], ['Cairo', 'Nairobi', 0.25, 2], ['Dubai', 'Mumbai', 0.45, 2], ['HOME', 'Warsaw', 0.90, 2],
  ['Lagos', 'SaoPaulo', 0.12, 1], ['Cairo', 'Dubai', 0.66, 2],
];
const getLL = (k) => (k === 'HOME' ? HOME : cities[k]);
const arcMats = [], rings = [];
const arcVS = `varying float vU; void main(){ vU = uv.x; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`;
const arcFS = `uniform float uHead; uniform vec3 uCol; uniform float uBase; varying float vU;
  void main(){ float trail = smoothstep(uHead - 0.42, uHead, vU) * step(vU, uHead);
    float head = exp(-pow((vU - uHead) * 26.0, 2.0));
    float a = uBase + trail * 0.75 + head;
    vec3 col = uCol * (0.55 + trail * 0.9) + vec3(1.0, 0.92, 0.8) * head * 2.6;
    gl_FragColor = vec4(col, clamp(a, 0.0, 1.0)); }`;
for (const [a, b, phase, mult] of routes) {
  const A = ll(...getLL(a)).normalize(), B = ll(...getLL(b)).normalize();
  const ang = A.angleTo(B);
  const pts = [];
  for (let i = 0; i <= 80; i++) {
    const s = i / 80;
    const v = new THREE.Vector3().copy(A).multiplyScalar(Math.sin((1 - s) * ang) / Math.sin(ang))
      .add(new THREE.Vector3().copy(B).multiplyScalar(Math.sin(s * ang) / Math.sin(ang)));
    pts.push(v.normalize().multiplyScalar(R * (1.004 + (0.08 + 0.42 * ang / Math.PI) * Math.sin(Math.PI * s))));
  }
  const m = new THREE.ShaderMaterial({
    uniforms: { uHead: { value: 0 }, uCol: { value: new THREE.Color(a === 'HOME' ? 0xffa24a : 0x6fc3ff) }, uBase: { value: a === 'HOME' ? 0.22 : 0.12 } },
    vertexShader: arcVS, fragmentShader: arcFS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  m.userData = { phase, mult };
  arcMats.push(m);
  earth.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 160, a === 'HOME' ? 0.012 : 0.008, 8, false), m));
  // landing ring at destination
  const ringMat = new THREE.MeshBasicMaterial({ color: a === 'HOME' ? 0xffb066 : 0x8fd2ff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.026, 0.034, 48), ringMat);
  const P = ll(...getLL(b), R * 1.006); ring.position.copy(P); ring.lookAt(P.clone().multiplyScalar(2));
  earth.add(ring); rings.push({ ring, phase, mult });
  const dot = new THREE.Mesh(new THREE.CircleGeometry(0.014, 24), new THREE.MeshBasicMaterial({ color: 0xffe2c0, transparent: true, opacity: 0.9, depthWrite: false }));
  dot.position.copy(ll(...getLL(b), R * 1.005)); dot.lookAt(dot.position.clone().multiplyScalar(2)); earth.add(dot);
}

// ---------- home beacon ----------
const homeP = ll(...HOME, R * 1.006);
const beacon = new THREE.Group(); beacon.position.copy(homeP); beacon.lookAt(homeP.clone().multiplyScalar(2)); earth.add(beacon);
beacon.add(new THREE.Mesh(new THREE.CircleGeometry(0.03, 32), new THREE.MeshBasicMaterial({ color: 0xfff1de })));
const homeRings = [0, 0.5].map((off) => {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.05, 0.062, 64), new THREE.MeshBasicMaterial({ color: 0xffa24a, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
  beacon.add(m); return { m, off };
});
{ // light pillar
  const g = new THREE.CylinderGeometry(0.004, 0.018, 0.55, 16, 1, true); g.translate(0, 0.275, 0); g.rotateX(Math.PI / 2);
  beacon.add(new THREE.Mesh(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    vertexShader: `varying float vH; void main(){ vH = position.z / 0.55; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying float vH; void main(){ gl_FragColor = vec4(vec3(1.0,0.66,0.32) * (1.0 - vH) * 1.6, 1.0); }`,
  })));
}

// ---------- orbit ring with satellites ----------
const orbit = new THREE.Group(); orbit.rotation.set(1.18, 0.0, -0.38); globe.add(orbit);
orbit.add(new THREE.Mesh(new THREE.TorusGeometry(R * 1.42, 0.0035, 8, 384), new THREE.MeshBasicMaterial({ color: 0x3f7fa3, transparent: true, opacity: 0.45, depthWrite: false })));
const sats = new THREE.Group(); orbit.add(sats);
const NS = 6;
for (let i = 0; i < NS; i++) {
  const a = (i / NS) * TAU;
  const s = new THREE.Mesh(new THREE.SphereGeometry(0.022, 16, 12), new THREE.MeshBasicMaterial({ color: 0xcfeaff }));
  s.position.set(Math.cos(a) * R * 1.42, Math.sin(a) * R * 1.42, 0); sats.add(s);
}

// ---------- stars ----------
const starU = { uTime: { value: 0 } };
{
  const pos = [], ph = [], sz = [], k = [];
  for (let i = 0; i < 1400; i++) {
    pos.push((rnd() - 0.5) * 60, (rnd() - 0.5) * 22, -18 - rnd() * 20);
    ph.push(rnd() * TAU); sz.push(0.6 + rnd() * rnd() * 2.6); k.push(1 + Math.floor(rnd() * 3));
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aPh', new THREE.Float32BufferAttribute(ph, 1));
  g.setAttribute('aSz', new THREE.Float32BufferAttribute(sz, 1));
  g.setAttribute('aK', new THREE.Float32BufferAttribute(k, 1));
  scene.add(new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: starU, transparent: true, depthWrite: false,
    vertexShader: `attribute float aPh; attribute float aSz; attribute float aK; uniform float uTime; varying float vA;
      void main(){ vA = 0.35 + 0.65 * (0.5 + 0.5 * sin(6.2831853 * aK * uTime / 8.0 + aPh));
        gl_PointSize = aSz; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying float vA; void main(){ float d = length(gl_PointCoord - 0.5); if (d > 0.5) discard;
      gl_FragColor = vec4(vec3(0.75, 0.86, 1.0), vA * smoothstep(0.5, 0.0, d) * 0.8); }`,
  })));
}

// ---------- post ----------
const composer = new EffectComposer(renderer);
composer.setPixelRatio(1); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.8, 0.55, 0.5);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- frame ----------
const nameEl = document.getElementById('name');
const ringEl = document.getElementById('ring');
const frac = (x) => x - Math.floor(x);

window.renderAt = (t) => {
  const u = t / T;
  earth.rotation.set(LAT0 * Math.PI / 180 + 0.025 * Math.sin(TAU * u), -(LON0 * Math.PI / 180) + 0.06 * Math.sin(TAU * u + 0.6), 0, 'XYZ');
  sats.rotation.z = TAU * u / NS;
  dotUniforms.uTime.value = t; starU.uTime.value = t;
  for (const m of arcMats) {
    const s = frac(u * m.userData.mult + m.userData.phase);
    m.uniforms.uHead.value = s * 1.6 - 0.15;
  }
  for (const r of rings) {
    // ring pulses right after the head reaches the destination (head = 1 at s = 0.72)
    const q = frac(u * r.mult + r.phase - 0.72);
    const k = q < 0.35 ? q / 0.35 : 1;
    r.ring.scale.setScalar(1 + k * 3.2);
    r.ring.material.opacity = q < 0.35 ? (1 - k) * 0.95 : 0;
  }
  for (const h of homeRings) {
    const q = frac(u * 2 + h.off);
    h.m.scale.setScalar(1 + q * 3.5);
    h.m.material.opacity = (1 - q) * 0.9;
  }
  // camera breathing
  camera.position.x = 0.05 * Math.sin(TAU * u);
  camera.position.y = 0.035 * Math.sin(TAU * u * 1 + 1.3);
  camera.lookAt(0, 0, 0);
  composer.render();
  // UI: shimmer sweep across the name during the first 35% of the loop
  const sw = Math.min(1, u / 0.35);
  nameEl.style.backgroundPosition = `${100 - sw * 100}% 0`;
  const pq = frac(u * 4);
  ringEl.style.transform = `scale(${1 + pq * 1.8})`;
  ringEl.style.opacity = String((1 - pq) * 0.7);
  return true;
};

await document.fonts.ready;
window.renderAt(Number(params.get('t') || 0));
window.__ready = true;
</script>
</body>
</html>
